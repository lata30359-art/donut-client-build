name: Build Donut Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract source
        run: |
          mkdir source
          unzip -q donut-client-main.zip -d source
          find source -type f -name gradlew

      - name: Build JAR
        run: |
          cd "$(dirname "$(find source -type f -name gradlew -print -quit)")"
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: donut-client-jars
          path: source/**/build/libs/*.jar
          if-no-files-found: error
