name: Build Donut Client

on:
  workflow_dispatch:
  push:
    paths:
      - "donut-client-main.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract client
        run: |
          mkdir source
          unzip -q donut-client-main.zip -d source
          find source -maxdepth 3 -type f | head -100

      - name: Build client
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="$(find source -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No Gradle wrapper found in ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Upload JAR files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: donut-client-jars
          path: source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
